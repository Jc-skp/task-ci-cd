name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Instalar dependências
      run: npm install
      
    - name: Executar build
      run: npm run build
      
    - name: Executar testes
      run: npm test
      
    - name: Gerar relatório de cobertura
      run: |
        npm test -- --coverage
        echo "Test coverage report generated"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage/
          package-lock.json

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Analisar com ESLint (simulado)
      run: |
        echo "Analisando qualidade do código..."
        echo "Nenhum problema encontrado!"
        echo "Métricas:"
        echo "   - Complexidade ciclomática: Baixa"
        echo "   - Mantibilidade: Alta"
        echo "   - Duplicação: 0%"
        
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Simular deploy
      run: |
        echo "Iniciando deploy..."
        echo "Versão: 1.0.0"
        echo "Ambiente: Production"
        echo "Deploy realizado com sucesso!"
        echo "URL: https://task-ci-cd-demo.netlify.app"
        
    - name: Notificar sucesso
      run: |
        echo "Pipeline concluído com sucesso!"
        echo "Resumo:"
        echo "   - Build: Sucesso"
        echo "   - Testes: Sucesso" 
        echo "   - Qualidade: Sucesso"
        echo "   - Deploy: Sucesso"
